mesh:
  file: square.pmsh

discretization:
  quadrature_points_xi: 2
  quadrature_points_eta: 2

physics:
  
  conductivity:
    type: constant
    value: 1.0
    # type: anisotropic
    # tensor: [2.0, 0.5, 0.5, 1.0]

  source:
    expression: "0.0"

boundary_conditions:
 
  - boundary: 0
    type: value
    expression: "(1-x)*(1-y)"
    forms: 
    - value_bc
    model: constant

  - boundary: 1
    type: value
    expression: "(1-x)*(1-y)"
    forms: 
    - value_bc
    model: constant

  - boundary: 2
    type: value
    expression: "(1-x)*(1-y)"
    forms: 
    - value_bc
    model: constant

  - boundary: 3
    type: value
    expression: "(1-x)*(1-y)"
    forms: 
    - value_bc
    model: constant

solver:

  driver:
    type: steady

  linear:
    type: cg
    tolerance: 1.0e-12
    max_iterations: 10000
    matrix_free: true
    # krylov_dim: 50

  # nonlinear:
    # type: newton
    # tolerance: 1e-8
    # max_iterations: 30

  # driver:
    # type: transient
    #
  # timestepper:
    # type: backward_euler
    # t0: 0.0
    # tf: 1.0
    # dt: 0.01

output:
  directory: output
  vtk: true
  write_frequency: 1
  prefix: solution
