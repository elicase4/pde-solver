mesh:

  file: ../../../mesh/cube/cube.pmsh

discretization:

  quadrature:
    xi: 2
    eta: 2
    zeta: 2

  dof_ordering:
    type: interleaved

physics:

  models:

    conductivity:
      type: constant
      value: 1.0

    source:
      type: volumetric
      expression: "0.0"

boundary_conditions:

  - boundary: 0
    type: value
    expression: "(1-x)*(1-y)*(1-z)"
    forms: [value_bc]
    model: constant

  - boundary: 1
    type: value
    expression: "(1-x)*(1-y)*(1-z)"
    forms: [value_bc]
    model: constant

  - boundary: 2
    type: value
    expression: "(1-x)*(1-y)*(1-z)"
    forms: [value_bc]
    model: constant

  - boundary: 3
    type: value
    expression: "(1-x)*(1-y)*(1-z)"
    forms: [value_bc]
    model: constant

  - boundary: 4
    type: value
    expression: "(1-x)*(1-y)*(1-z)"
    forms: [value_bc]
    model: constant

  - boundary: 5
    type: value
    expression: "(1-x)*(1-y)*(1-z)"
    forms: [value_bc]
    model: constant

initial_condition:
  type: expression
  expression: "0.0"

solver:

  driver:
    type: steady

  linear:

    type: cg

    operator:
      type: fem

    preconditioner:
      type: identity

    tolerance: 1.0e-12
    max_iterations: 10000

output:
  directory: output
  vtk: true
  write_frequency: 1
  prefix: block3d_constant_conductivity_solution

logging:

  solver:
    type: console

  driver:
    type: console

  output:
    file: log.txt
