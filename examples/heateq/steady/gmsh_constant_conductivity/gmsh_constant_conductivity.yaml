mesh:

  file: ../../../mesh/ubend/quarter_ubend.pmsh

discretization:

  quadrature:
    xi: 2
    eta: 2
    zeta: 2

  dof_ordering:
    type: interleaved

physics:

  models:

    conductivity:
      type: constant
      value: 1.0

    source:
      type: volumetric
      read:
        mode: expression
        expression: "0.0"

boundary_conditions:

  # hot inlet
  - boundary: 1
    type: value
    read:
      mode: expression
      expression: "100.0"
    forms: [value_bc]
    model: constant

  # cold outlet
  - boundary: 2
    type: value
    read:
      mode: expression
      expression: "0.0"
    forms: [value_bc]
    model: constant

  # insulated duct walls
  - boundary: 3
    type: flux
    read:
      mode: expression
      expression: ["0.0", "0.0", "0.0"]
    forms: [flux_bc]
    model: constant

initial_condition:
  read:
    mode: expression
    expression: "0.0"

monitors:

  - name: inlet_flux
    quantity: heat_flux
    reduction: integral
    terms:
      - boundary: 1

  - name: outlet_flux
    quantity: heat_flux
    reduction: integral
    terms:
      - boundary: 2

  - name: wall_flux
    quantity: heat_flux
    reduction: integral
    terms:
      - boundary: 3

  # average flux density through the inlet -- inlet_flux / inlet area
  - name: inlet_flux_avg
    quantity: heat_flux
    reduction: average
    terms:
      - boundary: 1

  # energy balance check
  - name: net_balance
    quantity: heat_flux
    reduction: integral
    terms:
      - boundary: 1
      - boundary: 2
      - boundary: 3

solver:

  driver:
    type: steady

  linear:

    type: cg

    operator:
      type: fem

    preconditioner:
      type: identity

    tolerance: 1.0e-10
    max_iterations: 10000

output:
  directory: output
  vtk: true
  write_frequency: 1
  prefix: gmsh_constant_conductivity_solution

logging:

  solver:
    type: console

  driver:
    type: console

  output:
    file: log.txt
