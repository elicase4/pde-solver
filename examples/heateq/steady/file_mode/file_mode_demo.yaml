mesh:
  file: ../../../mesh/square/square.pmsh

discretization:
  quadrature:
    xi: 2
    eta: 2
  dof_ordering:
    type: interleaved

physics:

  models:

    conductivity:
      type: constant
      value: 1.0

    source:
      type: volumetric
      read:
        mode: file
        file: source.pndf

boundary_conditions:

  - boundary: 0
    type: value
    read:
      mode: file
      file: dirichlet_boundary0.pndf
    forms: [value_bc]
    model: constant

  - boundary: 1
    type: flux
    read:
      mode: file
      file: flux_boundary1.pndf
    forms: [flux_bc]
    model: constant

  - boundary: 2
    type: value
    read:
      mode: expression
      expression: "(1-x)*(1-y)"
    forms: [value_bc]
    model: constant

  - boundary: 3
    type: value
    read:
      mode: expression
      expression: "(1-x)*(1-y)"
    forms: [value_bc]
    model: constant

initial_condition:
  read:
    mode: file
    file: initial_condition.pndf

solver:

  driver:
    type: steady

  linear:
    type: cg
    operator:
      type: fem
    preconditioner:
      type: identity
    tolerance: 1.0e-12
    max_iterations: 10000

output:
  directory: output
  vtk: true
  write_frequency: 1
  prefix: file_mode_demo_solution

logging:
  solver:
    type: console
  driver:
    type: console
  output:
    file: log.txt
